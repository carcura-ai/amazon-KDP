const cust=person(document.getElementById('cust'),{skin:'#f1c7a1',shirt:'#2f6f8f',pants:'#2e3a52',hair:'#4a2f1d',hairPath:'M66 130 Q70 50 150 48 Q232 50 236 130 Q210 92 150 92 Q92 92 66 130 Z'});
const work=person(document.getElementById('work'),{skin:'#e6b48e',shirt:'#111214',pants:'#2b2b2e',hair:'#2a1b12',hairPath:'M68 128 Q72 58 150 56 Q228 58 232 128 Q206 100 150 100 Q94 100 68 128 Z',cap:true,logo:true});
// Foam-Blasen
const foam=document.getElementById('foam'); const bub=[];for(let i=0;i<26;i++){bub.push([Math.random()*760+160,Math.random()*1.6,18+Math.random()*30]);el('circle',{r:1},foam);}
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>C((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,L=(a,b,x)=>a+(b-a)*x;
const SUBS=[[0.4,2.3,'Puh. Mein Auto ist <b>total dreckig.</b>'],[2.5,4.9,'Aber ich hab einfach <b>keine Zeit.</b>'],[5.3,7.6,'Also schreib ich <b>Carcura</b> bei WhatsApp.'],[8.0,10.2,'Die <b>holen das Auto ab.</b>'],[10.4,12.4,'Machen es in der Halle <b>richtig sauber.</b>'],[12.6,14.5,'Und <b>bringen es zurück.</b>'],[14.8,18.0,'<b>Wow! Wie neu.</b> Und ich musste nichts machen!']];
const KICK=[[0,5.1,'DAS PROBLEM'],[5.1,14.6,'DIE LÖSUNG'],[14.6,18.3,'DAS ERGEBNIS']];
const CUTS=[5.1,7.8,10.2,12.5,14.6,18.3];
window.render=function(t){
  const f=Math.min(MOUTH.length-1,Math.round(t*30)), talk=MOUTH[f]||0;
  const blink=(t%3.1>3.0)?1:0;
  const sc=t<5.1?'A':t<7.8?'B':t<10.2?'C':t<12.5?'D':t<14.6?'E':t<18.3?'F':'G';
  const out=['A','C','E','F'].includes(sc), hall=sc==='D';
  document.getElementById('out').setAttribute('opacity',out||sc==='B'?1:0);
  document.getElementById('hallg').setAttribute('opacity',hall?1:0);
  // Auto
  const car=document.getElementById('car'); let cx=60, cy=1000, cs=1, dirt=1, spin=0, sparkle=0;
  if(sc==='A'){cx=40; cs=.82; cy=1010;}
  if(sc==='B'){car.style.display='none';} else car.style.display='';
  if(sc==='C'){const p=eio(seg(t,9.0,10.2)); cx=L(40,1250,p); cs=.82; cy=1010; spin=p*900;}
  if(sc==='D'){cx=10; cs=.88; cy=965; const w=eio(seg(t,10.6,12.2)); document.getElementById('dirtrect').setAttribute('x',w*1000); dirt=1; sparkle=seg(t,11.6,12.4);}
  else document.getElementById('dirtrect').setAttribute('x', (sc==='A'||sc==='C')?0:2000);
  if(sc==='E'){const p=eo(seg(t,12.6,13.9)); cx=L(1250,40,p); cs=.82; cy=1010; spin=-(1-p)*900; sparkle=seg(t,13.6,14.4);}
  if(sc==='F'){cx=40; cs=.82; cy=1010; sparkle=.6+.4*Math.sin(t*6);}
  car.setAttribute('transform',`translate(${cx} ${cy}) scale(${cs})`);
  document.getElementById('sp1').setAttribute('transform',`rotate(${spin})`);document.getElementById('sp2').setAttribute('transform',`rotate(${spin})`);
  const gx=(sc==='D'||sc==='E'||sc==='F')?L(-300,1200,(t*0.6)%1):-600; document.getElementById('gl').setAttribute('x',gx);
  const sp=document.getElementById('sparks'); sp.setAttribute('opacity',sparkle); 
  // Fliegen
  const fl=document.getElementById('flies'); fl.setAttribute('opacity',sc==='A'?1:0);
  [...fl.children].forEach((c,i)=>{c.setAttribute('cx',300+i*170+Math.sin(t*5+i)*60);c.setAttribute('cy',1080+Math.cos(t*7+i*2)*40);});
  // Schaum
  foam.setAttribute('opacity',sc==='D'?C(1-seg(t,12.0,12.5)):0);
  [...foam.children].forEach((c,i)=>{const b=bub[i];const ph=((t-10.2)*0.9+b[1])%1.6/1.6;c.setAttribute('cx',b[0]+Math.sin(t*3+i)*12);c.setAttribute('cy',1260-ph*420);c.setAttribute('r',b[2]*(sc==='D'&&t>10.5?1:0));c.setAttribute('opacity',.85*(1-ph));});
  // Kunde
  const cg=document.getElementById('cust'); cg.style.display=(sc==='A'||sc==='F'||(sc==='E'&&t>13.4))?'':'none';
  if(sc==='A'){pose(cust,{x:880,y:1330,s:.95,armL:-8,armR:8,headTilt:L(0,-6,seg(t,2.5,3.0)),open:talk,smile:-.7,brow:-.8,blink});
    if(t>2.5){pose(cust,{x:880,y:1330,s:.95,armL:-25-Math.sin(t*4)*6,armR:25+Math.sin(t*4)*6,headTilt:-6,open:talk,smile:-.8,brow:-1,blink});}}
  if(sc==='E'){const a=eo(seg(t,13.4,13.9));pose(cust,{x:L(1150,880,a),y:1330,s:.95,armL:-10,armR:10,open:talk,smile:.3,brow:.4,blink,legL:Math.sin(t*14)*14*(1-a),legR:-Math.sin(t*14)*14*(1-a)});}
  if(sc==='F'){const j=Math.abs(Math.sin((t-14.6)*5.2))*90*C(1-seg(t,17.4,18.2));pose(cust,{x:880,y:1330-j,s:.95,armL:150+Math.sin(t*10)*12,armR:-150-Math.sin(t*10)*12,open:Math.max(talk,.25),smile:1,brow:.8,blink,legL:-12,legR:12});}
  // Mitarbeiter
  const wg=document.getElementById('work'); wg.style.display=(sc==='C'&&t<9.2)||sc==='D'?'':'none';
  if(sc==='C'){const a=eo(seg(t,7.9,8.9)); pose(work,{x:L(1200,880,a),y:1330,s:.95,armL:-10,armR:L(10,-140,seg(t,8.6,9.0)),smile:.7,brow:.3,blink,legL:Math.sin(t*14)*16*(1-a),legR:-Math.sin(t*14)*16*(1-a)}); wg.setAttribute('opacity',1-seg(t,9.0,9.2));}
  if(sc==='D'){wg.setAttribute('opacity',1); pose(work,{x:975,y:1440,s:.68,armL:-40+Math.sin(t*9)*18,armR:-20,smile:.8,brow:.2,blink});}
  // Handy
  const ph=document.getElementById('phone'); ph.setAttribute('opacity',sc==='B'?eo(seg(t,5.1,5.4)):0);
  ph.setAttribute('transform',`translate(260 ${L(560,430,eo(seg(t,5.1,5.5)))})`);
  document.getElementById('b1').setAttribute('opacity',eo(seg(t,5.35,5.6))); document.getElementById('b2').setAttribute('opacity',eo(seg(t,6.7,6.95)));
  // WOW
  const wow=document.getElementById('wow'); const wa=sc==='F'?eo(seg(t,14.8,15.2))*C(1-seg(t,17.8,18.2)):0; wow.style.opacity=wa; wow.style.transform=`scale(${L(.4,1,wa)+Math.sin(t*8)*.03}) rotate(-6deg)`;
  // Texte
  const k=KICK.find(x=>t>=x[0]&&t<x[1]); document.getElementById('kick').style.opacity=k?1:0; if(k)document.getElementById('kickt').textContent=k[2];
  const s=SUBS.find(x=>t>=x[0]&&t<x[1]); const sb=document.getElementById('sub'); sb.style.opacity=s?1:0; if(s)document.getElementById('subt').innerHTML=s[2];
  // Endkarte
  const ea=eo(seg(t,18.3,18.8)); const end=document.getElementById('end'); end.style.opacity=ea; end.style.transform=`scale(${L(1.06,1,ea)})`;
  // Wischer
  let wx=-2400; for(const c of CUTS){if(t>c-0.2&&t<c+0.25){wx=L(-1900,1500,(t-(c-0.2))/0.45);}} document.getElementById('wipe').style.left=wx+'px';
};
render(0);
