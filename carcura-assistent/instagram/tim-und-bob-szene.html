  if(t<T.T1[1]+0.2){tim.armL=-6+Math.sin(t*2)*3; tim.armR=6-Math.sin(t*2)*3; tim.tilt=-6+Math.sin(t*1.7)*3; tim.bob=Math.sin(t*2)*3;}
  if(t>=T.T2[0]&&t<T.T2[1]){tim.armR=-115+Math.sin(t*6)*8; tim.tilt=-10; tim.smile=-.9;}
  if(t>=T.B1[0]){tim.tilt=L(-4,10,eo(seg(t,T.B1[0],T.B1[0]+0.4))); tim.brow=L(-.9,.2,seg(t,T.B1[0],T.B1[0]+.6)); tim.smile=L(-.7,0,seg(t,T.B1[0],T.B1[0]+.6));}
  if(t>=T.B4[0]){tim.smile=.4; tim.brow=.5;}
  if(t>=T.T3[0]-0.1){const j=Math.abs(Math.sin((t-T.T3[0])*6))*70*(1-seg(t,T.T3[1]-0.3,T.T3[1]+0.1)); tim={...tim,bob:j,armL:150+Math.sin(t*9)*10,armR:-150-Math.sin(t*9)*10,smile:1,brow:.9,tilt:Math.sin(t*5)*5,open:Math.max(mt,.2)};}
  if(t>=T.T3[1]+0.05){tim={...tim,bob:0,armL:-8,armR:-160,thumb:1,smile:1,brow:.7,tilt:6,open:mt};}
  pose(TIM,tim);
  // Bob
  const ba=eio(seg(t,T.B1[0]-0.7,T.B1[0]+0.5)); const bv=t>T.B1[0]-0.7; document.getElementById('bob').style.display=bv?'':'none';
  let bob={x:L(1260,915,ba),y:1330,s:.92,flip:-1,armL:-6,armR:6,smile:.6,brow:.3,open:mb,blink:blinkB,tilt:Math.sin(t*2.2)*3};
  if(ba<1){bob.legL=Math.sin(t*13)*22;bob.legR=-Math.sin(t*13)*22;bob.bob=Math.abs(Math.sin(t*13))*10;bob.armR=-150+Math.sin(t*12)*25;}
  if(t>=T.B2[0]&&t<T.B2[1]){bob.armR=-70+Math.sin(t*3)*10; bob.tilt=-4;}
  if(t>=T.B3[0]&&t<T.B3[1]){bob.armL=-60+Math.sin(t*4)*12; bob.armR=60;}
  if(t>=T.B4[0]&&t<T.B4[1]){bob.armR=-100; bob.lean=-2;}
  if(t>=T.B5[0]&&t<T.B5[1]+0.2){const k=eo(seg(t,T.B5[0],T.B5[0]+.3)); bob.armL=L(-6,-55,k); bob.armR=L(6,55,k); bob.tilt=-8; bob.brow=.9;}
  if(t>=T.T3[0]&&t<TH-0.35){bob.armR=L(6,30,seg(t,T.T3[0],T.T3[0]+.4)); bob.smile=.9;}
  // Wurf: Ausholen -> Werfen
  const hc=document.getElementById('handcard');
  if(t>=TH-0.6){const k1=eio(seg(t,TH-0.6,TH-0.1)), k2=eo(seg(t,TH-0.1,TH+0.1)); bob.armR=L(L(6,-210,k1),-40,k2); bob.lean=L(0,6,k1)-k2*8; bob.smile=1; bob.brow=.6;}
  pose(BOB,bob);
  // Karte in Bobs Hand (vor dem Wurf)
  const handVis=false; hc.setAttribute('opacity',handVis?1:0);
  if(handVis){const a=(bob.armR)*Math.PI/180; const sx=915+((218-150)*.92*-1), sy=1330-(700-262)*.92; const hx=sx+Math.sin(a)*178*.92*-1*-1, hy=sy+Math.cos(a)*178*.92; hc.setAttribute('transform',`translate(${hx} ${hy}) rotate(${-bob.armR*0.5})`);}
  // Wurfkarte zur Kamera
  const tc=document.getElementById('throwcard'); const k=seg(t,TH,TH+0.85);
  if(t>=TH){const e=Math.pow(k,1.6); tc.setAttribute('opacity',1); tc.setAttribute('transform',`translate(${L(860,540,eo(k))} ${L(1000,960,eo(k))}) rotate(${L(-30,540,e)}) scale(${L(.1,3.2,e)})`);} else tc.setAttribute('opacity',0);
  document.getElementById('flash').style.opacity=C((t-(TH+0.6))/0.35);
  // Einblendungen
  popA('p1',T.B2[0]+0.2,T.B2[1]+0.15); const p2=popA('p2',T.B3[0]+0.2,T.B3[1]+0.15); popA('p3',T.B4[0]+0.2,T.B4[1]+0.2);
  ['c1','c2','c3','c4'].forEach((id,i)=>{document.getElementById(id).textContent= t>T.B3[0]+0.7+i*0.45?'✓':'';});
  const r=eio(seg(t,T.B4[0]+0.6,T.B4[0]+2.4)); const route=document.getElementById('route'); const len=route.getTotalLength(); const pt=route.getPointAtLength(len*(1-r));
  document.getElementById('minicar').setAttribute('transform',`translate(${pt.x} ${pt.y-20})`);
  // Untertitel
  const cur=TIMING.lines.find(l=>t>=l[2]-0.05&&t<l[3]+0.25); const sb=document.getElementById('sub');
  if(cur&&t<TH+0.3){sb.style.opacity=1; const s=SUB[cur[0]]; document.getElementById('subt').innerHTML=`<span class="n" style="color:${cur[1]==='tim'?'#7cc7ea':'#ffb199'}">${s[0]}</span>${s[1]}`;} else sb.style.opacity=0;
};
render(0);
</script></body></html>
