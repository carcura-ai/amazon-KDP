<section class="cc-qf" id="schnellanfrage" aria-labelledby="ccQfT">

<script>
(function () {
  var form = document.getElementById("ccQfForm");
  if (!form || form.getAttribute("data-ready") === "1") { return; }
  form.setAttribute("data-ready", "1");
  window.__ccrrBridge = true;
  var sec = document.getElementById("schnellanfrage");
  var secs = document.querySelectorAll("[class*='__hero'], [class*='-hero'], .cc-hero");
  if (!secs.length) { secs = document.querySelectorAll(".entry-content section, main section"); }
  for (var k = 0; k < secs.length; k++) {
    var s = secs[k];
    if (s === sec || sec.contains(s) || s.contains(sec)) { continue; }
    if (s.parentNode) { s.parentNode.insertBefore(sec, s.nextSibling); sec.classList.add("is-moved"); }
    break;
  }
  var svc = document.getElementById("ccQfSvc"), btn = document.getElementById("ccQfBtn"), msg = document.getElementById("ccQfMsg");
  var path = location.pathname;
  var pre = [["keramik", "Keramikversiegelung"], ["scheinwerfer", "Scheinwerfer"], ["innenreinigung", "Innenreinigung"], ["hol-und-bring", "Hol- und Bringservice"], ["politur", "Politur"]];
  for (var i = 0; i < pre.length; i++) { if (path.indexOf(pre[i][0]) !== -1) { svc.value = pre[i][1]; } }
  if (path.indexOf("westerwald") !== -1 || path.indexOf("leistungen") !== -1 || path.indexOf("anfragen") !== -1) { svc.value = "Basic Innen und Außen"; }
  function track(name, params) {
    try {
      if (typeof window.gtag === "function") { window.gtag("event", name, params); }
      else { (window.dataLayer = window.dataLayer || []).push({ event: name, cc_page: params.cc_page, cc_form: params.cc_form }); }
    } catch (e) {}
  }
  function gclid() {
    try { var d = JSON.parse(localStorage.getItem("ccrr_gclid") || "null"); if (!d) { return ""; } return d.v ? String(d.v) : ""; } catch (e) { return ""; }
  }
  var started = false;
  form.addEventListener("input", function () { if (!started) { started = true; track("cc_schnell_start", { cc_page: path, cc_form: "schnell" }); } });
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var name = document.getElementById("ccQfName").value.trim();
    var tel = document.getElementById("ccQfTel").value.trim();
    msg.className = "cc-qf__msg"; msg.textContent = "";
    if (!name) { msg.className = "cc-qf__msg is-err"; msg.textContent = "Bitte gib deinen Namen ein."; document.getElementById("ccQfName").focus(); return; }
    if (tel.replace(/[^0-9]/g, "").length < 6) { msg.className = "cc-qf__msg is-err"; msg.textContent = "Bitte gib eine Telefon- oder WhatsApp-Nummer ein."; document.getElementById("ccQfTel").focus(); return; }
    btn.disabled = true; btn.textContent = "Wird gesendet …";
    var payload = {
      name: name, phone: tel, email: "", vehicle: "", service: svc.value,
      message: "Rückruf gewünscht (Schnellanfrage auf " + path + ") · Leistung: " + svc.value,
      customer_type: "privat", source: "schnellanfrage", channel: "web", gclid: gclid(),
      website: document.getElementById("ccQfWeb").value
    };
    fetch("/wp-json/ccrr/v1/lead", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(payload) })
      .then(function (r) { if (!r.ok) { throw new Error("http"); } return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        if (d) { if (d.ok === false) { throw new Error("rejected"); } }
        track("cc_anfrage", { cc_page: path, cc_form: "schnell", cc_services: svc.value });
        form.reset(); svc.value = payload.service;
        msg.className = "cc-qf__msg is-ok";
        msg.textContent = "Danke, " + name.split(" ")[0] + "! Deine Anfrage ist da. Wir rufen dich zurück, meist noch heute.";
        btn.textContent = "Gesendet ✓";
      })
      .catch(function () {
        track("cc_anfrage_fehler", { cc_page: path, cc_form: "schnell" });
        msg.className = "cc-qf__msg is-err";
        msg.innerHTML = 'Das hat gerade nicht geklappt. Ruf uns direkt an: <a href="tel:+491706669516" style="color:#fff">0170 6669516</a> oder schreib per WhatsApp.';
        btn.disabled = false; btn.textContent = "Rückruf anfordern";
      });
  });
})();
</script>
