<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(anton-latin-400-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(montserrat-latin-800-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0d0d0f;font-family:M,sans-serif;color:#f3eee6;overflow:hidden;position:relative}
.glow{position:absolute;width:900px;height:900px;left:90px;top:330px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,243,32,.16),rgba(232,243,32,0) 62%)}
.top{position:absolute;top:70px;left:0;right:0;text-align:center}
.top img{width:300px}
.kicker{margin-top:26px;font-weight:800;font-size:26px;letter-spacing:.22em;color:#e8f320}
h1{position:absolute;top:300px;left:0;right:0;text-align:center;font-family:Anton;font-weight:400;
  font-size:104px;line-height:.98;letter-spacing:-.01em}
h1 span{color:#e8f320}
.card{position:absolute;left:290px;top:560px;width:500px;height:500px;background:#fff;border-radius:44px;
  padding:42px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 6px #e8f320}
.card img{width:100%;height:100%;display:block;image-rendering:pixelated}
.scan{position:absolute;left:0;right:0;top:1098px;text-align:center;font-weight:800;font-size:36px}
.scan b{color:#e8f320}
.stars{position:absolute;left:0;right:0;top:1162px;text-align:center;font-size:44px;letter-spacing:10px;color:#e8f320}
.foot{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-weight:700;font-size:22px;color:#b8b8bd;letter-spacing:.04em}
.corner{position:absolute;width:70px;height:70px;border:6px solid #e8f320}
</style></head><body>
<div class="glow"></div>
<div class="top"><img src="logo.png" alt="Carcura"><div class="kicker">WALTERSCHEN · WESTERWALD</div></div>
<h1>Zufrieden mit<br><span>Ihrem Auto?</span></h1>
<div class="card"><img src="qr.svg" alt="QR-Code zur Google-Bewertung"></div>
<div class="scan">Scannen &amp; in <b>30 Sekunden</b> bewerten</div>
<div class="stars">★★★★★</div>
<div class="foot">Danke! Jede Bewertung hilft uns als kleinem Betrieb enorm. · carcura.info</div>
</body></html>
