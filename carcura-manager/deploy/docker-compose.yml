# Zentrales Backend mit automatischem HTTPS (Let's Encrypt über Caddy).
# Start auf dem Server (Ordner carcura-manager/deploy):  docker compose up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN}
    volumes:
      - carcura-data:/data
    restart: unless-stopped
    expose:
      - "4800"

  caddy:
    image: caddy:2
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  carcura-data:
  caddy-data:
  caddy-config:
