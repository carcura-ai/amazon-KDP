<body><canvas id="c"></canvas>
<script>
// Carcura · Keramikversiegelung · Ablauf (24 s, 16:9). Alles Code, keine KI-Bilder. Seitenvertrag: renderAt(t), TOTAL, ready, EVENTS, ?t=, ?scale=.

// ---- Hintergrund + immer etwas in Bewegung -------------------------------------------------------------------

// ---- Panel (der Lack) -----------------------------------------------------------------------------------------

function clay(P, t) {   // Knetmasse: gleitet in drei Bahnen über den gewaschenen Lack

}
function band(P, t) {   // Polierlicht: ein breites Lichtband, aus dem Schaum-Kreis entstanden

function ring(P, t) {   // Szene 5: Ring füllt sich über „12 Stunden“, Prüflicht-Linie läuft über den Lack
