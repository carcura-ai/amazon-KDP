<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Keramik – Story</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#09090A}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Instagram-Story „Keramikversiegelung“: Problem → Ursache → Lösung → Beweis → Angebot → Termin.
   Zeitplan kommt aus ausgabe/zeitplan.json (Sätze + Wortzeiten der Sprecherstimme). render(t) zeichnet ein Bild.
   Story-Schutzzonen: oben 250 px (Fortschritt, Profil), unten 280 px (Antwortfeld) bleiben frei von Wichtigem. */
const W = 1080, H = 1920;
const GELB = '#E8F320', INK = '#09090A', GRAU = '#AEB2B9', ROT = '#FF5A4F';
const c = document.getElementById('c'), x = c.getContext('2d');
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => b <= a ? (t >= a ? 1 : 0) : cl((t - a) / (b - a));
const eo = v => 1 - Math.pow(1 - v, 3);
const eio = v => v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
const eback = v => { const k = 1.70158; return 1 + (k + 1) * Math.pow(v - 1, 3) + k * Math.pow(v - 1, 2); };
const lerp = (a, b, v) => a + (b - a) * v;
function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let r = Math.imul(s ^ s >>> 15, 1 | s); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }

// ---------- Zeitplan ----------
let Z = null, DAUER = 50;
const IDS = ['haken', 'auto', 'gefahr', 'merkst', 'problem', 'ursache', 'wende', 'loesung', 'schicht', 'uv', 'wasser', 'schmutz', 'ablauf', 'set', 'preis', 'cta', 'schluss'];
function setzeZeitplan(z) {
  if (!z) {                                         // Vorschau ohne Stimme: 2,8 s je Satz
    z = { dauer: IDS.length * 2.8 + 2, saetze: IDS.map((id, i) => ({ id, start: .4 + i * 2.8, ende: .4 + i * 2.8 + 2.2, woerter: [] })) };
  }
  Z = {}; DAUER = z.dauer;
  z.saetze.forEach((s, i) => { Z[s.id] = { a: s.start, e: s.ende, n: i + 1 < z.saetze.length ? z.saetze[i + 1].start : z.dauer, w: s.woerter || [] }; });
}
const S = id => Z[id];
// Zeit des k-ten Wortes (sonst gleichmäßig verteilt über den Satz)
function wort(id, k, anzahl) { const s = Z[id]; if (s.w.length > k) return s.w[k][1]; return lerp(s.a, s.e, k / Math.max(1, anzahl)); }
function wortSuche(id, stamm, ersatzK, anzahl) {
  const s = Z[id]; const f = s.w.find(w => w[0].startsWith(stamm)); return f ? f[1] : wort(id, ersatzK, anzahl);
}
const sichtbar = (t, a, b, ein = .45, aus = .35) => Math.min(p(t, a, a + ein), 1 - p(t, b - aus, b));

// ---------- Querschnitt ----------
const MITTE = 540, O = 1180;
const KER = O, KLAR = [O + 22, O + 162], BASIS = [O + 162, O + 262], GRUND = [O + 262, O + 322], BLECH = [O + 322, H];
const OB_L = KLAR[0], OB_R = KER;
let geteilt = false;                                // ab der Lösung: rechts mit Keramik
const ob = X => (geteilt && X >= MITTE) ? OB_R : OB_L;

function textur(w, h, fn) { const o = document.createElement('canvas'); o.width = w; o.height = h; fn(o.getContext('2d'), w, h); return o; }
const R0 = rng(7);
const TX_BLECH = textur(W, BLECH[1] - BLECH[0], (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#41444c'); gr.addColorStop(.03, '#2c2e34'); gr.addColorStop(.5, '#1b1c20'); gr.addColorStop(1, '#0d0d0f');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) { const y = R0() * h, l = 80 + R0() * 420, x0 = R0() * w - 100; g.strokeStyle = `rgba(255,255,255,${.012 + R0() * .035})`; g.lineWidth = 1; g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + l, y); g.stroke(); }
});
const TX_GRUND = textur(W, GRUND[1] - GRUND[0], (g, w, h) => {
  g.fillStyle = '#3a3c43'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${R0() < .5 ? '255,255,255' : '0,0,0'},${R0() * .07})`; g.fillRect(R0() * w, R0() * h, 2, 2); }
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, 0, w, 1);
});
const TX_BASIS = textur(W, BASIS[1] - BASIS[0], (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#24467e'); gr.addColorStop(1, '#0f2346');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2200; i++) { g.fillStyle = `rgba(${170 + R0() * 85},${200 + R0() * 55},255,${.12 + R0() * .55})`; g.beginPath(); g.arc(R0() * w, R0() * h, .5 + R0() * 1.3, 0, Math.PI * 2); g.fill(); }
});
const TX_GLANZ = textur(W, KLAR[1] - KLAR[0], (g, w, h) => {
  for (let i = -h; i < w; i += 90) { const gr = g.createLinearGradient(i, 0, i + 40, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,.07)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(i, h); g.lineTo(i + h * .6, 0); g.lineTo(i + h * .6 + 40, 0); g.lineTo(i + 40, h); g.fill(); }
});
const TX_TRUEB = textur(W, KLAR[1] - KLAR[0], (g, w, h) => {
  g.fillStyle = 'rgba(206,204,198,.38)'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(255,248,230,${R0() * .35})`; g.fillRect(R0() * w, R0() * h, 1 + R0() * 2, 1); }
  for (let i = 0; i < 120; i++) { const x0 = R0() * w, y0 = R0() * h; g.strokeStyle = `rgba(255,250,235,${.15 + R0() * .25})`; g.lineWidth = 1; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + 6 + R0() * 18, y0 + (R0() - .5) * 6); g.stroke(); }
});

// Schäden der Problemphase (werden beim Polieren in „wende“ von links nach rechts entfernt)
const R3 = rng(99);
const FLECKEN = Array.from({ length: 16 }, () => ({ x: 40 + R3() * 1000, r: 14 + R3() * 22, t: R3() }));
const SALZ = Array.from({ length: 70 }, () => ({ x: 20 + R3() * 1040, s: 3 + R3() * 5, t: R3(), r: R3() * 6 }));
const PDRECK = Array.from({ length: 90 }, () => ({ x: 20 + R3() * 1040, r: 3 + R3() * 5.5, t: R3(), col: ['#6d5b44', '#4b4037', '#7c6b55', '#5a4c3c'][Math.floor(R3() * 4)] }));

let truebL = 0, truebR = 0, polierX = -1e9;        // polierX: bis hierhin ist poliert (Schäden weg)

function schnitt(t, alpha, eingang) {
  if (alpha <= 0) return;
  const lag = t0 => ({ a: p(t, t0, t0 + .5) * alpha, dy: (1 - eo(p(t, t0, t0 + .8))) * 90 });
  const label = (s, y, a, col = 'rgba(255,255,255,.72)', gr = 24) => { x.save(); x.globalAlpha = a; x.font = `600 ${gr}px Poppins`; x.letterSpacing = '4px'; x.fillStyle = col; x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillText(s, 34, y); x.restore(); };
  const e0 = eingang;
  let L = lag(e0);
  x.globalAlpha = L.a; x.drawImage(TX_BLECH, 0, BLECH[0] + L.dy); label('BLECH', BLECH[0] + 46 + L.dy, L.a * .8);
  L = lag(e0 + .15); x.globalAlpha = L.a; x.drawImage(TX_GRUND, 0, GRUND[0] + L.dy); label('GRUNDIERUNG', (GRUND[0] + GRUND[1]) / 2 + L.dy, L.a * .8);
  L = lag(e0 + .3); x.globalAlpha = L.a; x.drawImage(TX_BASIS, 0, BASIS[0] + L.dy);
  x.fillStyle = 'rgba(112,112,116,.5)';
  x.globalAlpha = L.a * truebL; x.fillRect(0, BASIS[0] + L.dy, geteilt ? MITTE : W, BASIS[1] - BASIS[0]);
  if (geteilt) { x.globalAlpha = L.a * truebR; x.fillRect(MITTE, BASIS[0] + L.dy, W - MITTE, BASIS[1] - BASIS[0]); }
  label('BASISLACK (FARBE)', (BASIS[0] + BASIS[1]) / 2 + L.dy, L.a * .85);
  L = lag(e0 + .45);
  const kh = KLAR[1] - KLAR[0], ky = KLAR[0] + L.dy;
  x.globalAlpha = L.a;
  const kg = x.createLinearGradient(0, ky, 0, ky + kh); kg.addColorStop(0, 'rgba(210,226,244,.34)'); kg.addColorStop(1, 'rgba(150,176,208,.13)');
  x.fillStyle = kg; x.fillRect(0, ky, W, kh); x.drawImage(TX_GLANZ, 0, ky);
  const tbL = geteilt ? MITTE : W;
  x.globalAlpha = L.a * truebL; x.drawImage(TX_TRUEB, 0, 0, tbL, kh, 0, ky, tbL, kh);
  if (geteilt) { x.globalAlpha = L.a * truebR; x.drawImage(TX_TRUEB, MITTE, 0, W - MITTE, kh, MITTE, ky, W - MITTE, kh); }
  x.globalAlpha = L.a; x.fillStyle = 'rgba(255,255,255,.6)'; x.fillRect(0, ky, W, 2);
  label('KLARLACK', ky + kh / 2, L.a * .85, 'rgba(255,255,255,.8)');
  x.globalAlpha = 1;
}

// ---------- Hintergrund ----------
const R1 = rng(11);
const STERNE = Array.from({ length: 170 }, () => ({ x: R1() * W, y: R1() * (O - 60), r: .6 + R1() * 1.6, a: .25 + R1() * .6, f: .6 + R1() * 2.2, ph: R1() * 6.3 }));
const BOKEH = Array.from({ length: 10 }, () => ({ x: R1() * W, y: 620 + R1() * (O - 640), r: 40 + R1() * 90, a: .025 + R1() * .035, ph: R1() * 6.3 }));
function hintergrund(t, warm, kalt) {
  x.fillStyle = INK; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(W / 2, 560, 0, W / 2, 560, 950);
  g.addColorStop(0, kalt > 0 ? `rgba(255,90,79,${.05 * kalt})` : 'rgba(255,255,255,.035)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (const s of STERNE) { x.globalAlpha = s.a * (.55 + .45 * Math.sin(t * s.f + s.ph)); x.fillStyle = '#fff'; x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI * 2); x.fill(); }
  for (const b of BOKEH) { x.globalAlpha = b.a * (1 + warm * .8); x.fillStyle = `rgb(255,${Math.round(255 - 40 * warm)},${Math.round(255 - 110 * warm)})`; x.beginPath(); x.arc(b.x + Math.sin(t * .25 + b.ph) * 22, b.y + Math.cos(t * .2 + b.ph) * 10, b.r, 0, Math.PI * 2); x.fill(); }
  x.globalAlpha = 1;
}

// ---------- Text ----------
function text(s, y, o = {}) {
  const { size = 48, w = 400, col = '#fff', ls = 0, a = 1, dy = 0, sc = 1, glow = 0 } = o;
  if (a <= 0) return;
  x.save(); x.globalAlpha = a; x.translate(W / 2, y + dy); x.scale(sc, sc);
  x.font = `${w} ${size}px Poppins`; x.letterSpacing = ls + 'px'; x.fillStyle = col; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  if (glow) { x.shadowColor = col; x.shadowBlur = glow; }
  x.fillText(s, ls / 2, 0); x.restore();
}
function rein(t, a0, b0, fn, ein = .45, aus = .35) {         // Element blendet bei a0 ein, bei b0 aus
  const a = sichtbar(t, a0, b0, ein, aus); if (a <= 0) return;
  fn(a, (1 - eo(p(t, a0, a0 + .6))) * 30, eback(p(t, a0, a0 + .5)));
}

// ---------- Kapitel-Reiter ----------
function reiter(t) {
  const a0 = S('uv').a - .2, b0 = S('ablauf').a; const a = sichtbar(t, a0, b0, .4, .4); if (a <= 0) return;
  const namen = ['UV', 'WASSER', 'SCHMUTZ'], y = 330, h = 66, pad = 36, gap = 18;
  x.save(); x.globalAlpha = a; x.font = '600 28px Poppins'; x.letterSpacing = '5px';
  const ws = namen.map(n => x.measureText(n).width + pad * 2); const ges = ws.reduce((s, v) => s + v, 0) + gap * 2;
  const xs = []; let X = (W - ges) / 2; ws.forEach(w => { xs.push(X); X += w + gap; });
  const k = t < S('wasser').a - .2 ? 0 : t < S('schmutz').a - .2 ? eio(p(t, S('wasser').a - .2, S('wasser').a + .2)) : 1 + eio(p(t, S('schmutz').a - .2, S('schmutz').a + .2));
  const i0 = Math.floor(k), i1 = Math.min(2, i0 + 1), f = k - i0;
  namen.forEach((n, i) => { x.beginPath(); x.roundRect(xs[i], y - h / 2, ws[i], h, h / 2); x.strokeStyle = 'rgba(255,255,255,.2)'; x.lineWidth = 2; x.stroke(); });
  x.beginPath(); x.roundRect(lerp(xs[i0], xs[i1], f), y - h / 2, lerp(ws[i0], ws[i1], f), h, h / 2); x.fillStyle = GELB; x.fill();
  x.textAlign = 'center'; x.textBaseline = 'middle';
  namen.forEach((n, i) => { x.fillStyle = Math.abs(xs[i] - lerp(xs[i0], xs[i1], f)) < ws[i] / 2 ? INK : 'rgba(255,255,255,.62)'; x.fillText(n, xs[i] + ws[i] / 2 + 2.5, y + 2); });
  x.restore();
}

// ---------- Szene 1: Handy mit Hülle, dann Auto ----------
function handy(t) {
  const s = S('haken'), a = sichtbar(t, s.a - .3, S('auto').a + .5, .5, .5); if (a <= 0) return;
  const huelle = eback(p(t, lerp(s.a, s.e, .55), lerp(s.a, s.e, .55) + .45));
  const weg = eio(p(t, S('auto').a - .1, S('auto').a + .5));
  x.save(); x.globalAlpha = a; x.translate(W / 2 - weg * 260, 1020); x.scale(1 - weg * .25, 1 - weg * .25);
  x.lineWidth = 6; x.strokeStyle = 'rgba(255,255,255,.9)';
  x.beginPath(); x.roundRect(-120, -235, 240, 470, 34); x.stroke();
  x.fillStyle = 'rgba(255,255,255,.06)'; x.fill();
  x.beginPath(); x.roundRect(-38, -218, 76, 14, 7); x.fillStyle = 'rgba(255,255,255,.7)'; x.fill();
  if (huelle > 0) {                                   // Hülle schiebt sich drüber
    x.save(); x.translate(0, (1 - huelle) * 320); x.globalAlpha = a * cl(huelle * 1.4);
    x.shadowColor = GELB; x.shadowBlur = 30; x.lineWidth = 16; x.strokeStyle = GELB;
    x.beginPath(); x.roundRect(-140, -255, 280, 510, 46); x.stroke(); x.restore();
  }
  x.restore();
}
function autoLinie(t) {
  const s = S('auto'), a = sichtbar(t, s.a, S('gefahr').a + .4, .4, .5); if (a <= 0) return;
  const zeichnen = eio(p(t, s.a, s.a + 1.4));
  x.save(); x.globalAlpha = a; x.translate(W / 2 + 140, 1000); x.scale(.82, .82); x.translate(-500, -170);
  x.lineCap = 'round'; x.lineJoin = 'round'; x.lineWidth = 7; x.strokeStyle = 'rgba(255,255,255,.92)';
  x.setLineDash([4000, 4000]); x.lineDashOffset = 4000 * (1 - zeichnen);
  x.beginPath();
  x.moveTo(70, 250); x.lineTo(45, 240); x.quadraticCurveTo(28, 200, 62, 176); x.quadraticCurveTo(120, 150, 250, 136);
  x.bezierCurveTo(330, 82, 430, 62, 520, 68); x.bezierCurveTo(600, 74, 660, 108, 702, 134);
  x.quadraticCurveTo(860, 148, 940, 174); x.quadraticCurveTo(988, 196, 975, 236); x.lineTo(958, 250); x.lineTo(864, 250);
  x.arc(790, 250, 74, 0, Math.PI, true); x.lineTo(304, 250); x.arc(230, 250, 74, 0, Math.PI, true); x.lineTo(70, 250);
  x.stroke();
  x.beginPath(); x.moveTo(300, 140); x.bezierCurveTo(360, 98, 440, 84, 520, 86); x.bezierCurveTo(580, 90, 625, 112, 650, 136); x.closePath(); x.lineWidth = 5; x.stroke();
  x.setLineDash([]);
  const r = p(t, s.a + .7, s.a + 1.3);
  if (r > 0) for (const cx of [230, 790]) { x.globalAlpha = a * r; x.lineWidth = 7; x.beginPath(); x.arc(cx, 250, 58, 0, Math.PI * 2); x.stroke(); x.lineWidth = 4; x.beginPath(); x.arc(cx, 250, 30, 0, Math.PI * 2); x.stroke(); }
  x.restore();
}

// ---------- Szene 2: Gefahren schlagen ein ----------
function gefahren(t) {
  const s = S('gefahr');
  const tw = [wortSuche('gefahr', 'sonne', 0, 4), wortSuche('gefahr', 'regen', 1, 4), wortSuche('gefahr', 'streu', 2, 4), wortSuche('gefahr', 'vogel', 3, 4)];
  const namen = ['Sonne', 'Regen', 'Streusalz', 'Vogelkot'];
  const ende = S('merkst').a;
  // großes Wort, das gerade fällt
  namen.forEach((n, i) => {
    const b = i < 3 ? tw[i + 1] : ende; const a = sichtbar(t, tw[i] - .05, b + .05, .12, .15);
    if (a > 0) text(n + '.', 640, { size: 128, w: 800, ls: -4, a, sc: lerp(1.25, 1, eo(p(t, tw[i] - .05, tw[i] + .25))) });
  });
  // Sonne: Strahlen + Trübung
  const sa = sichtbar(t, tw[0] - .1, tw[1] + .3, .2, .3);
  if (sa > 0) {
    x.save(); x.globalAlpha = sa; x.strokeStyle = '#ffd88c'; x.lineWidth = 4; x.shadowColor = 'rgba(255,200,110,.9)'; x.shadowBlur = 14; x.setLineDash([30, 60]); x.lineDashOffset = -t * 600;
    for (let k = 0; k < 9; k++) { const tx = 70 + k * 117.5; x.beginPath(); x.moveTo(MITTE + (tx - MITTE) * .25, 760); x.lineTo(tx, OB_L); x.stroke(); }
    x.restore();
  }
  // Regen
  if (t > tw[1] - .1 && t < tw[2] + .4) {
    const R = rng(5); x.save(); x.strokeStyle = 'rgba(190,220,255,.75)'; x.lineWidth = 3;
    for (let i = 0; i < 40; i++) { const x0 = R() * W, v = 1500 + R() * 600, d0 = R() * .6; const y = 760 + ((t - tw[1] + d0) * v) % (OB_L - 760); x.beginPath(); x.moveTo(x0, y); x.lineTo(x0 - 6, y + 34); x.stroke(); }
    x.restore();
  }
  // Vogelkot fällt
  const fv = p(t, tw[3] - .25, tw[3] + .05);
  if (fv > 0 && fv < 1) { x.save(); x.fillStyle = '#e9e6dc'; x.beginPath(); x.ellipse(720, lerp(760, OB_L - 14, fv * fv), 16, 22, 0, 0, Math.PI * 2); x.fill(); x.restore(); }
}
function schaeden(t) {
  const s = S('gefahr');
  const tR = wortSuche('gefahr', 'regen', 1, 4), tS = wortSuche('gefahr', 'streu', 2, 4), tV = wortSuche('gefahr', 'vogel', 3, 4);
  const weg = X => X < polierX;                       // schon poliert?
  if (t > S('loesung').a + 1) return;
  // Wasserflecken (Kalkränder)
  for (const f of FLECKEN) {
    const a = p(t, tR + .2 + f.t * .5, tR + .5 + f.t * .5); if (a <= 0 || weg(f.x)) continue;
    x.save(); x.globalAlpha = a * .85; x.strokeStyle = 'rgba(235,235,225,.8)'; x.lineWidth = 3;
    x.beginPath(); x.ellipse(f.x, OB_L + 2, f.r, 5, 0, 0, Math.PI * 2); x.stroke(); x.restore();
  }
  // Streusalz
  for (const k of SALZ) {
    const v = p(t, tS - .1 + k.t * .4, tS + .2 + k.t * .4); if (v <= 0 || weg(k.x)) continue;
    const y = lerp(820, OB_L - k.s, v * v);
    x.save(); x.translate(k.x, y); x.rotate(k.r); x.fillStyle = 'rgba(245,245,240,.95)'; x.fillRect(-k.s / 2, -k.s / 2, k.s, k.s); x.restore();
  }
  // Vogelkot: Fleck + Ätzkrater im Klarlack
  const v = p(t, tV + .05, tV + .3);
  if (v > 0 && !weg(720)) {
    x.save(); x.fillStyle = 'rgba(70,52,30,.55)'; x.beginPath(); x.ellipse(720, OB_L + 16, 46 * eo(v), 18 * eo(v), 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#e9e6dc'; x.beginPath(); x.ellipse(720, OB_L - 6, 40 * eo(v), 9, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = 'rgba(160,150,120,.9)'; x.beginPath(); x.ellipse(712, OB_L - 9, 14 * eo(v), 4, 0, 0, Math.PI * 2); x.fill(); x.restore();
  }
  // Dreck, der hängen bleibt (Problem-Satz)
  const td = wortSuche('problem', 'dreck', 9, 13);
  for (const d of PDRECK) {
    const u = p(t, td - .1 + d.t * .6, td + .3 + d.t * .6); if (u <= 0 || weg(d.x)) continue;
    x.save(); x.fillStyle = d.col; x.beginPath(); x.arc(d.x, lerp(860, OB_L - d.r * .6, u * u), d.r, 0, Math.PI * 2); x.fill(); x.restore();
  }
}
function problemChips(t) {
  const s = S('problem');
  const tk = [wortSuche('problem', 'stumpf', 3, 13), wortSuche('problem', 'flecken', 6, 13), wortSuche('problem', 'dreck', 9, 13)];
